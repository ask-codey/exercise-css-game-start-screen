<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Hopper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="start-screen">
    <div class="sky" aria-hidden="true">
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
    </div>

    <h1 class="title">Star Hopper</h1>
    <p class="tagline">Hop from planet to planet, collect the stardust, and keep clear of the sun.</p>

    <nav class="menu" aria-label="Game menu">
      <button class="menu-button start-button" type="button">Start</button>
      <button class="menu-button" type="button">How to play</button>
      <button class="menu-button" type="button">High scores</button>
    </nav>

    <div class="loading" role="status">
      <p class="loading-label">Loading the galaxy…</p>
      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>
    </div>
  </main>
</body>
</html>
